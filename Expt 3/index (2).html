<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1{
            color:darkblue;
            text-align:center;
        }

        .container{
            width:350px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
            color:green;
        }
    </style>
</head>

<body>

<div class="container">

<h1>Student Grading System</h1>

<label>Student Name</label><br>
<input type="text" id="name"><br><br>

<label>Enter Marks (0-100)</label><br>
<input type="number" id="marks"><br><br>

<!-- Inline CSS + Inline JavaScript -->
<button
style="background:blue;color:white;padding:8px 15px;"
onclick="calculateGrade()">
Calculate Grade
</button>

<button type="reset">Clear</button>

<div id="result"></div>

</div>

<!-- External JS -->
<script src="script.js"></script>

<!-- Internal JavaScript -->
<script>
console.log("Student Grade Page Loaded");
console.info("Enter marks between 0 and 100");
console.warn("Invalid marks are not accepted");
</script>

</body>
</html>
