<!DOCTYPE html>
<html>

<head>

    <title>Shopping Website</title>

    <link rel="stylesheet" href="style.css">

    <script>
        function welcome() {
            alert("Welcome to Shopping Store!");
        }
    </script>

</head>

<body onload="welcome()">

    <h1>Online Shopping Store</h1>

    <div class="container">

        <h2>Select Products</h2>

        <table border="1">

            <tr>
                <th>Product</th>
                <th>Price (₹)</th>
                <th>Quantity</th>
            </tr>

            <tr>
                <td>Laptop</td>
                <td>50000</td>
                <td>
                    <input type="number" id="laptop" value="0" min="0">
                </td>
            </tr>

            <tr>
                <td>Mobile</td>
                <td>20000</td>
                <td>
                    <input type="number" id="mobile" value="0" min="0">
                </td>
            </tr>

            <tr>
                <td>Headphones</td>
                <td>3000</td>
                <td>
                    <input type="number" id="headphone" value="0" min="0">
                </td>
            </tr>

            <tr>
                <td>Keyboard</td>
                <td>1500</td>
                <td>
                    <input type="number" id="keyboard" value="0" min="0">
                </td>
            </tr>

            <tr>
                <td>Mouse</td>
                <td>800</td>
                <td>
                    <input type="number" id="mouse" value="0" min="0">
                </td>
            </tr>

            <tr>
                <td>Monitor</td>
                <td>10000</td>
                <td>
                    <input type="number" id="monitor" value="0" min="0">
                </td>
            </tr>

        </table>

        <br>

        <button onclick="calculateBill()">Calculate Bill</button>

        <h2>Bill Details</h2>

        <p>Total Price : ₹<span id="total">0</span></p>

        <p>GST (15%) : ₹<span id="gst">0</span></p>

        <p>Discount (10%) : ₹<span id="discount">0</span></p>

        <h2>Final Amount : ₹<span id="final">0</span></h2>

    </div>

    <!-- Footer -->
    <footer>
        <p>Developed by <strong>Parth Denge</strong></p>
        <p>PRN: <strong>24070521018</strong></p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
