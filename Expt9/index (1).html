<!DOCTYPE html>
<html>
<head>
    <title>Login Validation</title>

   
    <link rel="stylesheet" href="style.css">

   
    <style>
        h2{
            text-align:center;
            color:darkblue;
        }

        .container{
            width:350px;
            margin:auto;
            margin-top:80px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        #result{
            margin-top:15px;
            font-weight:bold;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Login Form</h2>

Username<br>
<input type="text" id="username"><br><br>

Password<br>
<input type="password" id="password">

<label class="showpass">
    <input type="checkbox" onclick="showPassword()">
    Show Password
</label>
<br><br>


<button
style="background:blue;color:white;padding:8px 20px;"
onclick="validateLogin()">
Login
</button>

<p id="result"></p>

</div>


<script src="script.js"></script>


<script>
console.log("Login Page Loaded");
console.info("Username and Password Validation");
console.warn("Invalid login credentials");
</script>

</body>
</html>
